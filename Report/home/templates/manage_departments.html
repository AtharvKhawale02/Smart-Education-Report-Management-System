<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Departments</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-6">Manage Departments</h1>

        <!-- Add New Department Form -->
        <form method="POST" class="mb-8">
            {% csrf_token %}
            <div class="mb-4">
                <label for="name" class="block text-gray-700">Department Name:</label>
                <input type="text" name="name" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div class="mb-4">
                <label for="description" class="block text-gray-700">Description:</label>
                <textarea name="description" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>
            
            <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">Add Department</button>
        </form>

        <!-- List of Departments -->
        <h2 class="text-xl font-semibold mb-4">Existing Departments</h2>
        <ul class="space-y-4">
            {% for department in departments %}
                <li class="bg-gray-50 p-4 rounded-lg shadow-sm">
                    <span class="font-semibold">{{ department.name }}</span> - {{ department.description }} - <span class="text-gray-600">{{ department.hod.full_name }}</span>
                </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
